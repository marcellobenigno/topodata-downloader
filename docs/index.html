<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPODATA Downloader — plugin para QGIS / QGIS plugin</title>
<link rel="alternate" hreflang="pt-br" href="pt-br/"><link rel="alternate" hreflang="en" href="en/">
<link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="assets/style.css">
<script>
(function () {
  var langs = ["pt-br", "en"], pick = null;
  try { pick = localStorage.getItem("topodata-doc-lang"); } catch (e) {}
  if (langs.indexOf(pick) < 0) {
    var nav = (navigator.languages || [navigator.language || "pt-br"]).map(function (l) {
      return l.toLowerCase(); });
    pick = "en";
    for (var i = 0; i < nav.length; i++) {
      if (nav[i].indexOf("pt") === 0) { pick = "pt-br"; break; }
      if (nav[i].indexOf("en") === 0) { pick = "en"; break; }
    }
  }
  location.replace(pick + "/");
})();
</script>
</head>
<body>
<div class="hero"><div class="wrap" style="grid-template-columns:1fr">
  <div><h1>TOPODATA Downloader</h1>
  <p class="lead">Documentação · Documentation</p>
  <a class="btn primary" href="pt-br/">Português</a>
  <a class="btn primary" href="en/">English</a></div>
</div></div>
</body>
</html>
