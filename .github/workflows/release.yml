name: Release

# Envie uma tag como 0.1.0 (o mesmo número de `version=` em metadata.txt) para:
#   1. conferir a versão e rodar os testes sem QGIS;
#   2. conferir e compilar as traduções (translations/*.json -> .qm) e gerar o ZIP do plugin
#      (scripts/make_zip.py);
#   3. criar a release no GitHub com as notas do CHANGELOG.md e o ZIP anexado;
#   4. publicar o ZIP no plugins.qgis.org com o token do plugin (secret QGIS_TOKEN, em
#      Settings > Secrets and variables > Actions). Sem o secret, esse passo é ignorado.
on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04         # fixado: imagens mais novas podem não ter o lrelease do Qt5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o lrelease (Qt Linguist)
        run: sudo apt-get update -q && sudo apt-get install -y -q qttools5-dev-tools
      - name: Conferir se a tag é a versão do metadata.txt
        run: |
          grep -q "^version=${GITHUB_REF_NAME}$" topodata_downloader/metadata.txt \
            || { echo "A tag ${GITHUB_REF_NAME} difere de version= em metadata.txt"; exit 1; }
      - name: Testes sem QGIS
        run: |
          pip install pytest
          python -m pytest -q tests/test_core.py
      - name: Gerar o ZIP (traduções completas e compiladas)
        run: python scripts/make_zip.py
      - name: Criar a release (notas do CHANGELOG.md + ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' \
            CHANGELOG.md > notes.md
          ZIP="dist/topodata_downloader-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
      - name: Publicar no plugins.qgis.org (secret QGIS_TOKEN)
        # mesma chamada do qgis-plugin-ci (upload_plugin_to_osgeo_with_token)
        env:
          QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}
        run: |
          if [ -z "$QGIS_TOKEN" ]; then
            echo "::notice::Sem o secret QGIS_TOKEN: publicação no plugins.qgis.org ignorada"
            exit 0
          fi
          ZIP="dist/topodata_downloader-${GITHUB_REF_NAME}.zip"
          code=$(curl -sS -o resposta.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${QGIS_TOKEN}" -F "package=@${ZIP}" \
            https://plugins.qgis.org/plugins/api/topodata_downloader/version/add/)
          head -c 2000 resposta.txt; echo
          case "$code" in
            2*) echo "Publicado: https://plugins.qgis.org/plugins/topodata_downloader/" ;;
            *) echo "::error::plugins.qgis.org respondeu HTTP $code"; exit 1 ;;
          esac
